
<div id="er2" style="padding:8px 0"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false, theme: 'base', fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: { darkMode: dark, fontSize: '13px', fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c', textColor: dark ? '#c2c0b6' : '#3d3d3a' }
});
const { svg } = await mermaid.render('er2-svg', `erDiagram
  UTENTI {
    varchar username PK "chiave primaria"
    varchar nome "NOT NULL"
    varchar cognome "NOT NULL"
    char password_hash "SHA-256, 64 char"
    date data_nascita "facoltativo"
    varchar domicilio
    varchar ruolo "cliente o ristoratore"
  }
  RISTORANTI {
    varchar nome PK "chiave primaria"
    varchar nazione "NOT NULL"
    varchar citta "NOT NULL"
    varchar indirizzo "NOT NULL"
    float latitudine "CHECK -90..90"
    float longitudine "CHECK -180..180"
    numeric fascia_prezzo "CHECK > 0"
    boolean delivery "DEFAULT false"
    boolean prenotazione "DEFAULT false"
    varchar tipo_cucina "NOT NULL"
    varchar proprietario FK "NOT NULL"
  }
  RECENSIONI {
    varchar nome_ristorante FK "PK composita"
    varchar username_cliente FK "PK composita"
    smallint stelle "CHECK 1..5"
    text testo "NOT NULL"
    text risposta "NULL se non risposto"
  }
  PREFERITI {
    varchar username FK "PK composita"
    varchar nome_ristorante FK "PK composita"
  }
  UTENTI ||--o{ RISTORANTI : "proprietario"
  UTENTI ||--o{ RECENSIONI : "username_cliente"
  RISTORANTI ||--o{ RECENSIONI : "nome_ristorante"
  UTENTI ||--o{ PREFERITI : "username"
  RISTORANTI ||--o{ PREFERITI : "nome_ristorante"
`);
document.getElementById('er2').innerHTML = svg;
document.querySelectorAll('#er2 svg .node').forEach(node => {
  const fp = node.querySelector('path[d]');
  if (!fp) return;
  const d = fp.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs=[nums[0],nums[2],nums[4],nums[6]],ys=[nums[1],nums[3],nums[5],nums[7]];
  const x=Math.min(...xs),y=Math.min(...ys),w=Math.max(...xs)-x,h=Math.max(...ys)-y;
  const rect=document.createElementNS('http://www.w3.org/2000/svg','rect');
  rect.setAttribute('x',x);rect.setAttribute('y',y);
  rect.setAttribute('width',w);rect.setAttribute('height',h);rect.setAttribute('rx','8');
  for(const a of['fill','stroke','stroke-width','class','style'])
    if(fp.hasAttribute(a))rect.setAttribute(a,fp.getAttribute(a));
  fp.replaceWith(rect);
});
</script>
