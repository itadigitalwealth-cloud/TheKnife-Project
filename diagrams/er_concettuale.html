
<div id="er1" style="padding:8px 0"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false, theme: 'base', fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: { darkMode: dark, fontSize: '13px', fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c', textColor: dark ? '#c2c0b6' : '#3d3d3a' }
});
const { svg } = await mermaid.render('er1-svg', `erDiagram
  UTENTE {
    string username PK
    string nome
    string cognome
    string password_hash
    date data_nascita
    string domicilio
    string ruolo
  }
  RISTORANTE {
    string nome PK
    string nazione
    string citta
    string indirizzo
    float latitudine
    float longitudine
    float fascia_prezzo
    boolean delivery
    boolean prenotazione
    string tipo_cucina
  }
  RECENSIONE {
    int stelle
    string testo
    string risposta
  }
  PREFERITO {
    date data_aggiunta
  }
  UTENTE ||--o{ RISTORANTE : "gestisce (ristoratore)"
  UTENTE ||--o{ RECENSIONE : "scrive (cliente)"
  RISTORANTE ||--o{ RECENSIONE : "riceve"
  UTENTE ||--o{ PREFERITO : "ha"
  RISTORANTE ||--o{ PREFERITO : "compare in"
`);
document.getElementById('er1').innerHTML = svg;
document.querySelectorAll('#er1 svg .node').forEach(node => {
  const fp = node.querySelector('path[d]');
  if (!fp) return;
  const d = fp.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0],nums[2],nums[4],nums[6]], ys = [nums[1],nums[3],nums[5],nums[7]];
  const x=Math.min(...xs),y=Math.min(...ys),w=Math.max(...xs)-x,h=Math.max(...ys)-y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg','rect');
  rect.setAttribute('x',x); rect.setAttribute('y',y);
  rect.setAttribute('width',w); rect.setAttribute('height',h); rect.setAttribute('rx','8');
  for (const a of ['fill','stroke','stroke-width','class','style'])
    if (fp.hasAttribute(a)) rect.setAttribute(a,fp.getAttribute(a));
  fp.replaceWith(rect);
});
</script>
